<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141312">
<title>Panel — Comic Library</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="masthead">
    <h1>PANEL<span>.</span></h1>
    <div class="tagline">a self-hosted comic library</div>
  </header>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search titles or authors…" autocomplete="off">
    <div class="tag-filters" id="tagFilters"></div>
  </div>

  <main class="gallery" id="gallery">
    <!-- cards injected by js/app.js -->
  </main>

  <div class="empty-state" id="emptyState" hidden>Nothing matches that search.</div>

  <footer class="site-footer">
    Add a comic by dropping a folder into <code>/comics</code> and adding an entry to <code>/data/comics.json</code>.
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
